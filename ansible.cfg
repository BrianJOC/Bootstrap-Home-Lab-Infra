[defaults]
roles_path     = ansible/roles
collections_path = ansible/collections:~/.ansible/collections
# Suppress deprecation noise in CI/headless output
deprecation_warnings = False
# SSH settings tuned for the bootstrap target
remote_user    = ansible
private_key_file = test/keys/test_id_ed25519
host_key_checking = False

[ssh_connection]
pipelining = True
