[defaults]
roles_path     = ansible/roles
# Collections are controller dependencies, not repository source. Keeping them
# in the user collection path prevents their own test fixtures from being
# traversed by `go test ./...`.
collections_path = ~/.ansible/collections
# Suppress deprecation noise in CI/headless output
deprecation_warnings = False
# SSH settings tuned for the bootstrap target
remote_user    = ansible
private_key_file = test/keys/test_id_ed25519
host_key_checking = False

[ssh_connection]
pipelining = True
