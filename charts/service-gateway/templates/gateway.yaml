apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
type: Opaque
stringData:
  client-secret: {{ required "clientSecret is required" .Values.clientSecret | quote }}
  cookie-secret: {{ required "cookieSecret is required" .Values.cookieSecret | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels: {bootstrap-access: {{ .Release.Name | quote }}}
  template:
    metadata:
      labels: {bootstrap-access: {{ .Release.Name | quote }}}
      annotations:
        checksum/credentials: {{ printf "%s%s" .Values.clientSecret .Values.cookieSecret | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: oauth2-proxy
          image: {{ .Values.image | quote }}
          args:
            - --provider=oidc
            - --oidc-issuer-url={{ .Values.issuer }}
            - --client-id={{ .Values.clientID }}
            - --redirect-url=https://{{ .Values.hostname }}/oauth2/callback
            - --scope=openid email profile groups
            - --oidc-groups-claim=groups
            {{- range .Values.allowedGroups }}
            - --allowed-group={{ . }}
            {{- end }}
            - --email-domain=*
            - --code-challenge-method=S256
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=1h
            - --reverse-proxy=true
            - --skip-provider-button=true
            - --http-address=0.0.0.0:4180
            - --upstream={{ .Values.upstream }}
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Release.Name }}, key: client-secret}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Release.Name }}, key: cookie-secret}
          ports: [{name: http, containerPort: 4180}]
          readinessProbe: {httpGet: {path: /ready, port: http}, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /ping, port: http}, initialDelaySeconds: 10}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: NodePort
  selector: {bootstrap-access: {{ .Release.Name | quote }}}
  ports: [{name: http, port: 4180, targetPort: http, nodePort: {{ .Values.nodePort }}}]
---
# Every workload in this dedicated namespace accepts application traffic only
# through the authentication proxy. The proxy itself has a separate allow rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: bootstrap-access-only}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {bootstrap-access: {{ .Release.Name | quote }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: bootstrap-gateway}
spec:
  podSelector:
    matchLabels: {bootstrap-access: {{ .Release.Name | quote }}}
  policyTypes: [Ingress]
  ingress:
    - ports: [{protocol: TCP, port: 4180}]
