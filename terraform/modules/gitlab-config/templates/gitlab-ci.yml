# GitLab CI/CD pipeline for infrastructure/iac.
# The host-managed shell runner supplies pinned Terraform and target-local
# checkpoint access; MAAS_API_KEY is a masked bootstrap credential.

variables:
  TF_ROOT: ${CI_PROJECT_DIR}/terraform
  TF_STATE_NAME: maas-machines

default:
  tags:
    - terraform

stages:
  - validate
  - plan
  - apply
  - checkpoint

.terraform_backend: &terraform_backend
  before_script:
    - sudo /usr/local/sbin/bootstrap-gitlab-freeze-guard
    - export TF_HTTP_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
    - export TF_HTTP_LOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
    - export TF_HTTP_UNLOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
    - export TF_HTTP_LOCK_METHOD=POST
    - export TF_HTTP_UNLOCK_METHOD=DELETE
    - export TF_HTTP_USERNAME=gitlab-ci-token
    - export TF_HTTP_PASSWORD="${CI_JOB_TOKEN}"

validate:
  stage: validate
  script:
    - cd "$TF_ROOT"
    - terraform init -backend=false
    - terraform validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

plan:
  stage: plan
  <<: *terraform_backend
  resource_group: infrastructure-plan
  script:
    - cd "$TF_ROOT"
    - terraform init
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - $TF_ROOT/tfplan
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

apply:
  stage: apply
  <<: *terraform_backend
  script:
    - sudo /usr/local/sbin/bootstrap-gitlab-freeze-guard
    - cd "$TF_ROOT"
    - terraform init
    - terraform apply -auto-approve tfplan
  dependencies:
    - plan
  resource_group: infrastructure-apply
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production

checkpoint:
  stage: checkpoint
  script:
    - sudo /usr/local/sbin/bootstrap-gitlab-checkpoint
  needs:
    - apply
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  resource_group: infrastructure-apply
