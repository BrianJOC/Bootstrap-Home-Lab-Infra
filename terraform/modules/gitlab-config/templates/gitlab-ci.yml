# GitLab CI/CD pipeline for infrastructure/iac
# Runs terraform validate → plan → apply on merge to main

image:
  name: hashicorp/terraform:1.6
  entrypoint: [""]

variables:
  TF_ROOT: ${CI_PROJECT_DIR}/terraform
  TF_STATE_NAME: homelab

stages:
  - validate
  - plan
  - apply
  - checkpoint

# Authenticate to Vault using GitLab CI OIDC id_token (GitLab 15.7+).
# CI_JOB_JWT_V2 was deprecated in GitLab 16 and removed in GitLab 17.
.vault_auth: &vault_auth
  id_tokens:
    VAULT_ID_TOKEN:
      aud: ${VAULT_ADDR}
  before_script:
    - export TF_HTTP_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
    - export TF_HTTP_LOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
    - export TF_HTTP_UNLOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
    - export TF_HTTP_LOCK_METHOD=POST
    - export TF_HTTP_UNLOCK_METHOD=DELETE
    - export TF_HTTP_USERNAME=gitlab-ci-token
    - export TF_HTTP_PASSWORD="${CI_JOB_TOKEN}"
    - |
      VAULT_TOKEN=$(curl -sf \
        --request POST \
        --data "{\"jwt\": \"$VAULT_ID_TOKEN\", \"role\": \"$VAULT_ROLE\"}" \
        "$VAULT_ADDR/v1/auth/$VAULT_AUTH_PATH/login" | jq -r '.auth.client_token')
      export VAULT_TOKEN

validate:
  stage: validate
  <<: *vault_auth
  script:
    - cd $TF_ROOT
    - terraform init -backend=false
    - terraform validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

plan:
  stage: plan
  <<: *vault_auth
  resource_group: infrastructure-plan
  script:
    - cd $TF_ROOT
    - terraform init
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - $TF_ROOT/tfplan
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

apply:
  stage: apply
  <<: *vault_auth
  script:
    - cd $TF_ROOT
    - terraform init
    - terraform apply -auto-approve tfplan
  dependencies:
    - plan
  resource_group: infrastructure-apply
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  environment:
    name: production

checkpoint:
  stage: checkpoint
  script:
    - sudo /usr/local/sbin/bootstrap-gitlab-checkpoint
  needs:
    - apply
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  resource_group: infrastructure-apply
