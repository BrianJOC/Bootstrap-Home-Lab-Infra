name: source-gates

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject merge-conflict markers
        run: |
          if rg -n '^(<{7}|={7}|>{7})( |$)' --glob '!reports/**' .; then
            exit 1
          fi
      - name: Check formatting
        run: test -z "$(bin/gofmt -l cmd internal)"
      - run: bin/go test ./cmd/... ./internal/...
      - run: bin/go build ./...
      - run: bin/go vet ./...

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Hermit-pinned Ansible test toolchain
        run: bin/just dev-setup
      - name: Syntax check complete stage chain
        run: >-
          .venv/bin/ansible-playbook --syntax-check ansible/playbooks/site.yml
          -i 'bootstrap_target,'
          -e bootstrap_server_ip=127.0.0.1
          -e internal_domain=home.example.com
      - run: .venv/bin/ansible-lint ansible/playbooks ansible/roles

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bin/terraform fmt -check -recursive terraform
      - name: Validate roots and modules
        run: bin/just tf-validate
      - name: Validate seeded GitLab project and service chart
        run: bin/just test-gitops-generated
