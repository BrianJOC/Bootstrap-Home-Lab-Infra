---
# Non-secret group vars — paths, service names, ports.
# Secrets are NEVER placed here; they are passed as extra-vars by the Go runner.

# Internal domain — set at runtime via extra-vars; this is just a fallback placeholder
internal_domain: "home.example.com"

# Bootstrap server IP — set at runtime via extra-vars
bootstrap_server_ip: "127.0.0.1"

# Admin email — set at runtime via extra-vars
admin_email: "admin@example.com"
