---
- name: Create cert directory
  ansible.builtin.file:
    path: "{{ cert_dir }}"
    state: directory
    mode: "0755"

# When using a non-production ACME server (e.g., Pebble for testing), its CA cert
# must be trusted by the system so lego can verify TLS to the ACME server.
# Pebble uses a self-signed cert; add it to the Ubuntu system CA bundle.
# validate_certs: false is intentional and test-only. This task is gated on
# lego_acme_ca_cert_url being non-empty, which is never set in production.
# The CA cert being fetched (pebble minica) is already installed in the trust
# store by mocks-up-vm before Ansible runs, so in practice this task is a no-op
# in CI. The option is kept for environments where mocks-up-vm has not run.
- name: Download ACME CA certificate for test ACME server
  ansible.builtin.get_url:
    url: "{{ lego_acme_ca_cert_url }}"
    dest: /usr/local/share/ca-certificates/acme-test-ca.crt
    validate_certs: false # test-only; not executed when lego_acme_ca_cert_url is empty (production default)
    mode: "0644"
  when: lego_acme_ca_cert_url | length > 0
  register: acme_ca_download

- name: Update system CA certificates
  ansible.builtin.command: update-ca-certificates
  register: update_ca_result
  when: acme_ca_download is changed
  changed_when: "'Updating certificates' in update_ca_result.stdout"

# Idempotency: check if cert exists and is valid (not expiring within 30 days).
# lego stores wildcard certs with '*' replaced by '_' in the filename.
# Threshold: 2592000 seconds = 30 days (must match tls_renew_threshold_seconds).
- name: Check if certificate file already exists
  ansible.builtin.stat:
    path: "{{ cert_dir }}/certificates/_.{{ internal_domain }}.crt"
  register: cert_stat

- name: Check certificate expiry if cert exists
  ansible.builtin.command: >
    openssl x509 -checkend {{ tls_renew_threshold_seconds }} -noout
    -in {{ cert_dir }}/certificates/_.{{ internal_domain }}.crt
  register: cert_expiry_check
  changed_when: false
  failed_when: false
  when: cert_stat.stat.exists

- name: Set cert_valid fact
  ansible.builtin.set_fact:
    cert_valid: >-
      {{ cert_stat.stat.exists and
         (cert_expiry_check.rc is defined and cert_expiry_check.rc == 0) }}

- name: Issue TLS certificate via Cloudflare DNS-01
  ansible.builtin.command: >
    {{ lego_install_dir }}/lego
    --accept-tos
    --email={{ admin_email }}
    --domains=*.{{ internal_domain }}
    --domains={{ internal_domain }}
    --dns={{ lego_dns_provider }}
    --dns.disable-cp
    --server={{ acme_server_url }}
    --path={{ cert_dir }}
    run
  environment:
    CLOUDFLARE_DNS_API_TOKEN: "{{ cf_dns_api_token }}"
    CF_DNS_API_TOKEN: "{{ cf_dns_api_token }}"
    HTTPREQ_ENDPOINT: "{{ lego_httpreq_endpoint }}"
  when: not cert_valid
  register: lego_run
  no_log: true

# Always enforce restrictive key permissions, not only on issuance.
# This corrects any drift (e.g., manual chmod) without re-issuing the cert.
- name: Restrict private key permissions
  ansible.builtin.file:
    path: "{{ cert_dir }}/certificates/_.{{ internal_domain }}.key"
    mode: "0600"

- name: Get certificate expiry date
  ansible.builtin.command: >
    openssl x509 -enddate -noout
    -in {{ cert_dir }}/certificates/_.{{ internal_domain }}.crt
  register: cert_enddate
  changed_when: false
  when: not cert_valid

- name: Write cert meta.json
  ansible.builtin.copy:
    content: |
      {"expiry":"{{ cert_enddate.stdout | regex_replace('^notAfter=', '') }}","domain":"{{ internal_domain }}","san":["*.{{ internal_domain }}","{{ internal_domain }}"],"issuer":"lego"}
    dest: "{{ cert_dir }}/certificates/meta.json"
    mode: "0644"
  when: not cert_valid

- name: Create immutable certificate version root
  ansible.builtin.file:
    path: "{{ cert_dir }}/{{ internal_domain }}/versions"
    state: directory
    mode: "0700"

- name: Inspect stable certificate directory
  ansible.builtin.stat:
    path: "{{ cert_dir }}/certificates"
    follow: false
  register: stable_certificate_directory

- name: Adopt the initially issued certificate as an immutable version
  when:
    - stable_certificate_directory.stat.exists
    - not stable_certificate_directory.stat.islnk
  block:
    - name: Create initial immutable version
      ansible.builtin.command:
        cmd: >-
          cp -a {{ cert_dir }}/certificates
          {{ cert_dir }}/{{ internal_domain }}/versions/initial
        creates: "{{ cert_dir }}/{{ internal_domain }}/versions/initial"

    - name: Point current at the initial version
      ansible.builtin.file:
        src: versions/initial
        dest: "{{ cert_dir }}/{{ internal_domain }}/current"
        state: link
        force: true

    - name: Remove mutable initial certificate directory after copying
      ansible.builtin.file:
        path: "{{ cert_dir }}/certificates"
        state: absent

    - name: Create stable certificate symlink
      ansible.builtin.file:
        src: "{{ cert_dir }}/{{ internal_domain }}/current/certificates"
        dest: "{{ cert_dir }}/certificates"
        state: link

- name: Create protected bootstrap secret directory
  ansible.builtin.file:
    path: /etc/bootstrap-home-infra
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: certificate_renewal_enabled | bool

- name: Store the scoped Cloudflare token for sealed-Vault renewal
  ansible.builtin.copy:
    content: "{{ cf_dns_api_token }}"
    dest: /etc/bootstrap-home-infra/cloudflare-dns-token
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: certificate_renewal_enabled | bool

- name: Install certificate renewal implementation
  ansible.builtin.template:
    src: bootstrap-renew-certificate.sh.j2
    dest: /usr/local/sbin/bootstrap-renew-certificate
    owner: root
    group: root
    mode: "0700"

- name: Install certificate renewal service
  ansible.builtin.template:
    src: bootstrap-certificate-renew.service.j2
    dest: /etc/systemd/system/bootstrap-certificate-renew.service
    mode: "0644"

- name: Install certificate renewal timer
  ansible.builtin.template:
    src: bootstrap-certificate-renew.timer.j2
    dest: /etc/systemd/system/bootstrap-certificate-renew.timer
    mode: "0644"

- name: Apply certificate renewal timer policy
  ansible.builtin.systemd:
    name: bootstrap-certificate-renew.timer
    enabled: "{{ certificate_renewal_enabled | bool }}"
    state: "{{ 'started' if certificate_renewal_enabled | bool else 'stopped' }}"
    daemon_reload: true
