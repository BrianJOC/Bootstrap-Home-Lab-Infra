---
dependency:
  name: galaxy
  options:
    requirements-file: "${MOLECULE_PROJECT_DIRECTORY}/../../requirements.yml"
    role-file: "${MOLECULE_PROJECT_DIRECTORY}/../../requirements.yml"
driver:
  name: default
platforms:
  - name: instance
    address: "127.0.0.1"  # overridden by MOLECULE_TARGET env var in test harness
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../../collections"
  connection_options:
    ansible_ssh_private_key_file: "${MOLECULE_PROJECT_DIRECTORY}/../../../test/keys/test_id_ed25519"
    ansible_user: ansible
  inventory:
    hosts:
      all:
        hosts:
          instance:
            ansible_host: "${MOLECULE_TARGET:-127.0.0.1}"
            ansible_port: "${MOLECULE_PORT:-2222}"
verifier:
  name: ansible
lint: |
  set -e
  ansible-lint
