---
- name: Assert required variables are defined
  ansible.builtin.assert:
    that:
      - internal_domain is defined and internal_domain != ""
      - bootstrap_server_ip is defined and bootstrap_server_ip != ""
      - maas_admin_password is defined and maas_admin_password != ""
      - admin_email is defined and admin_email != ""
    fail_msg: "maas_install requires internal_domain, bootstrap_server_ip, maas_admin_password, and admin_email"

- name: Ensure ~/.bootstrap directory exists on controller
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.bootstrap"
    state: directory
    mode: "0700"
  delegate_to: localhost
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  become: false

- name: Validate the opt-in MAAS DHCP boundary
  ansible.builtin.assert:
    that:
      - lab_vlan_interface | length > 0
      - dhcp_range_low | length > 0
      - dhcp_range_high | length > 0
    fail_msg: "MAAS DHCP requires one explicit interface and dynamic range."
  when: maas_dhcp_enabled | bool

- name: Confirm the selected lab interface exists
  ansible.builtin.command:
    cmd: "ip link show dev {{ lab_vlan_interface }}"
  changed_when: false
  when: maas_dhcp_enabled | bool

- name: Confirm the lab gateway is reachable before any Terraform cutover
  ansible.builtin.command:
    cmd: "ping -c 1 -W 2 {{ lab_gateway }}"
  changed_when: false
  when: maas_dhcp_enabled | bool

- name: Record that Ansible does not mutate DHCP ownership
  ansible.builtin.debug:
    msg: >-
      MAAS DHCP preflight passed for {{ lab_vlan_subnet }} on
      {{ lab_vlan_interface }}. Terraform owns any later MAAS API cutover.
  when: maas_dhcp_enabled | bool

# Idempotency gate: check if MAAS snap is already installed
- name: Check if MAAS snap is installed
  ansible.builtin.command: snap list maas
  register: maas_snap_check
  changed_when: false
  failed_when: false

- name: Set maas_already_installed fact
  ansible.builtin.set_fact:
    maas_already_installed: "{{ maas_snap_check.rc == 0 }}"

- name: Install MAAS
  ansible.builtin.include_tasks: install.yml
  when: not maas_already_installed

# configure.yml runs unconditionally — idempotent via init status check and admin user check
- name: Configure MAAS
  ansible.builtin.include_tasks: configure.yml

- name: Verify MAAS
  ansible.builtin.include_tasks: verify.yml
