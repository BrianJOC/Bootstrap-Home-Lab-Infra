---
- name: Create Authentik data directory
  ansible.builtin.file:
    path: "{{ authentik_data_dir }}"
    state: directory
    mode: "0755"

- name: Create Authentik media directory
  ansible.builtin.file:
    path: "{{ authentik_data_dir }}/media"
    state: directory
    mode: "0755"

- name: Create Authentik custom-templates directory
  ansible.builtin.file:
    path: "{{ authentik_data_dir }}/custom-templates"
    state: directory
    mode: "0755"

- name: Template Authentik Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ authentik_data_dir }}/docker-compose.yml"
    mode: "0644"
  notify: restart authentik

- name: Template Authentik .env file
  ansible.builtin.template:
    src: authentik.env.j2
    dest: "{{ authentik_data_dir }}/.env"
    mode: "0600"
  notify: restart authentik
  no_log: true

- name: Start Authentik via Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ authentik_data_dir }}"
    state: present
  no_log: true
