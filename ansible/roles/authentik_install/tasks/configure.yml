---
- name: Wait for Authentik API to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ authentik_port_http }}/api/v3/root/config/"
    method: GET
    status_code: [200]
  register: authentik_api_check
  retries: 30
  delay: 10
  until: authentik_api_check.status == 200

# Authentik's automated bootstrap can complete migrations and create akadmin
# without persisting AUTHENTIK_BOOTSTRAP_TOKEN after an interrupted first boot.
# Reconcile it from the already protected container environment. The secret is
# never placed in Ansible arguments, output, or a target-side temporary file.
- name: Reconcile bootstrap API token after interrupted initialization
  community.docker.docker_container_exec:
    container: authentik-server
    argv:
      - ak
      - shell
      - -c
      - |-
        import os
        from authentik.core.models import Token, User
        user = User.objects.get(username="akadmin")
        key = os.environ["AUTHENTIK_BOOTSTRAP_TOKEN"]
        token, created = Token.objects.get_or_create(
            identifier="bootstrap-terraform",
            defaults={"user": user, "key": key, "intent": "api", "expiring": False},
        )
        changed = created
        if not created and (token.user_id != user.pk or token.key != key or token.intent != "api" or token.expiring):
            token.user = user
            token.key = key
            token.intent = "api"
            token.expiring = False
            token.save()
            changed = True
        print("bootstrap-token-updated" if changed else "bootstrap-token-current")
  register: authentik_token_reconcile
  changed_when: "'bootstrap-token-updated' in authentik_token_reconcile.stdout"
  no_log: true
  when: not authentik_db_initialized | default(false)

- name: Verify the bootstrap API token for Terraform handoff
  ansible.builtin.uri:
    url: "http://localhost:{{ authentik_port_http }}/api/v3/core/tokens/"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: [200]
  no_log: true

- name: Write Authentik initialized marker
  ansible.builtin.file:
    path: "{{ authentik_data_dir }}/.initialized"
    state: touch
    mode: "0400"
    modification_time: preserve
    access_time: preserve
  when: not authentik_db_initialized | default(false)

- name: Remove bootstrap credentials from persisted Authentik environment
  ansible.builtin.template:
    src: authentik.env.j2
    dest: "{{ authentik_data_dir }}/.env"
    mode: "0600"
  vars:
    authentik_db_initialized: true
  no_log: true
  when: not authentik_db_initialized | default(false)

- name: Record declarative configuration ownership
  ansible.builtin.debug:
    msg: >-
      Authentik runtime is ready. Terraform owns groups, providers,
      applications, policy bindings, and client-secret outputs.
