---
# Wait for Authentik API to be available
- name: Wait for Authentik API to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ authentik_port_http }}/api/v3/root/config/"
    method: GET
    status_code: [200]
    validate_certs: false
  register: authentik_api_check
  retries: 30
  delay: 10
  until: authentik_api_check.status == 200

# Write initialized marker. This causes the env template to omit bootstrap credentials
# on subsequent runs — the template checks authentik_db_initialized via the marker stat.
- name: Write Authentik initialized marker
  ansible.builtin.file:
    path: "{{ authentik_data_dir }}/.initialized"
    state: touch
    mode: "0400"
  when: not authentik_db_initialized | default(false)

# Get API token for further configuration
- name: Get Authentik API token
  ansible.builtin.uri:
    url: "http://localhost:{{ authentik_port_http }}/api/v3/core/tokens/"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: [200]
    validate_certs: false
  register: authentik_token_check
  no_log: true
  when: authentik_bootstrap_token != ""

# Create OIDC provider for Vault
- name: Check if Vault OIDC provider exists
  ansible.builtin.uri:
    url: "http://localhost:{{ authentik_port_http }}/api/v3/providers/oauth2/?name=vault"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: [200]
    validate_certs: false
  register: vault_oidc_check
  no_log: true
  when: authentik_bootstrap_token != ""

- name: Create Vault OIDC provider
  ansible.builtin.uri:
    url: "http://localhost:{{ authentik_port_http }}/api/v3/providers/oauth2/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
      Content-Type: application/json
    body_format: json
    body:
      name: vault
      client_type: confidential
      redirect_uris:
        - url: "https://vault.{{ internal_domain }}:8200/ui/vault/auth/oidc/oidc/callback"
          matching_mode: strict
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: null
    status_code: [201]
    validate_certs: false
  when:
    - authentik_bootstrap_token != ""
    - vault_oidc_check.json.count is defined
    - vault_oidc_check.json.count == 0
  no_log: true

# Create OIDC provider for GitLab
- name: Check if GitLab OIDC provider exists
  ansible.builtin.uri:
    url: "http://localhost:{{ authentik_port_http }}/api/v3/providers/oauth2/?name=gitlab"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: [200]
    validate_certs: false
  register: gitlab_oidc_check
  no_log: true
  when: authentik_bootstrap_token != ""

- name: Create GitLab OIDC provider
  ansible.builtin.uri:
    url: "http://localhost:{{ authentik_port_http }}/api/v3/providers/oauth2/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
      Content-Type: application/json
    body_format: json
    body:
      name: gitlab
      client_type: confidential
      redirect_uris:
        - url: "https://gitlab.{{ internal_domain }}/users/auth/openid_connect/callback"
          matching_mode: strict
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: null
    status_code: [201]
    validate_certs: false
  when:
    - authentik_bootstrap_token != ""
    - gitlab_oidc_check.json.count is defined
    - gitlab_oidc_check.json.count == 0
  no_log: true

- name: Read the effective GitLab OIDC provider
  ansible.builtin.uri:
    url: "http://localhost:{{ authentik_port_http }}/api/v3/providers/oauth2/?name=gitlab"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: [200]
  register: gitlab_oidc_effective
  no_log: true
  when: authentik_bootstrap_token != ""

- name: Persist the GitLab OIDC client secret on the controller
  ansible.builtin.copy:
    content: "{{ gitlab_oidc_effective.json.results[0].client_secret }}"
    dest: "{{ lookup('env', 'HOME') }}/.bootstrap/oidc-gitlab-secret"
    mode: "0600"
  delegate_to: localhost
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  become: false
  no_log: true
  when:
    - gitlab_oidc_effective.json.results is defined
    - gitlab_oidc_effective.json.results | length == 1

- name: Check whether the GitLab Authentik application exists
  ansible.builtin.uri:
    url: "http://localhost:{{ authentik_port_http }}/api/v3/core/applications/?slug=gitlab"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: [200]
  register: gitlab_application_check
  no_log: true
  when: authentik_bootstrap_token != ""

- name: Create the GitLab Authentik application
  ansible.builtin.uri:
    url: "http://localhost:{{ authentik_port_http }}/api/v3/core/applications/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
      Content-Type: application/json
    body_format: json
    body:
      name: GitLab
      slug: gitlab
      provider: "{{ gitlab_oidc_effective.json.results[0].pk }}"
    status_code: [201]
  no_log: true
  when:
    - gitlab_application_check.json.results is defined
    - gitlab_application_check.json.results | length == 0

- name: Read the effective Vault OIDC provider
  ansible.builtin.uri:
    url: "http://localhost:{{ authentik_port_http }}/api/v3/providers/oauth2/?name=vault"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: [200]
  register: vault_oidc_effective
  no_log: true
  when: authentik_bootstrap_token != ""

- name: Persist the Vault OIDC client secret on the controller
  ansible.builtin.copy:
    content: "{{ vault_oidc_effective.json.results[0].client_secret }}"
    dest: "{{ lookup('env', 'HOME') }}/.bootstrap/oidc-vault-secret"
    mode: "0600"
  delegate_to: localhost
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  become: false
  no_log: true
  when:
    - vault_oidc_effective.json.results is defined
    - vault_oidc_effective.json.results | length == 1

- name: Check whether the Vault Authentik application exists
  ansible.builtin.uri:
    url: "http://localhost:{{ authentik_port_http }}/api/v3/core/applications/?slug=vault"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: [200]
  register: vault_application_check
  no_log: true
  when: authentik_bootstrap_token != ""

- name: Create the Vault Authentik application
  ansible.builtin.uri:
    url: "http://localhost:{{ authentik_port_http }}/api/v3/core/applications/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
      Content-Type: application/json
    body_format: json
    body:
      name: Vault
      slug: vault
      provider: "{{ vault_oidc_effective.json.results[0].pk }}"
    status_code: [201]
  no_log: true
  when:
    - vault_application_check.json.results is defined
    - vault_application_check.json.results | length == 0
