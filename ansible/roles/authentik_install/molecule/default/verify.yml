---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Check that authentik-server container is running
      community.docker.docker_container_info:
        name: authentik-server
      register: authentik_server_info

    - name: Assert authentik-server container is running
      ansible.builtin.assert:
        that:
          - authentik_server_info.container is defined
          - authentik_server_info.container.State.Running | default(false)
        fail_msg: "authentik-server container is not running"

    - name: Check Authentik API responds on port 9000
      ansible.builtin.uri:
        url: "http://127.0.0.1:9000/api/v3/root/config/"
        method: GET
        status_code: 200
      register: authentik_api
      retries: 10
      delay: 30
      until: authentik_api.status == 200

    - name: Assert Authentik API responded with 200
      ansible.builtin.assert:
        that:
          - authentik_api.status == 200
        fail_msg: "Authentik API on port 9000 did not return 200 (status: {{ authentik_api.status }})"
        success_msg: "Authentik API is responding on port 9000"
