---
authentik_version: "2024.2.2"
authentik_port_http: 9000
authentik_port_https: 9443
authentik_data_dir: /opt/authentik
service_data_root: ""

# Auto-generated secrets — persisted on the controller at ~/.bootstrap/ on first run.
# lookup('password', path) creates the file with a random value if missing; reads it on
# subsequent runs. Override in Molecule tests with fixed values.
authentik_secret_key: >-
  {{ lookup('password', (lookup('env', 'HOME') + '/.bootstrap/authentik-secret-key')
     + ' length=50 chars=ascii_letters,digits') }}
authentik_db_password: >-
  {{ lookup('password', (lookup('env', 'HOME') + '/.bootstrap/pg-authentik-password')
     + ' length=32 chars=ascii_letters,digits') }}

# Bootstrap token — if set, used by configure.yml to wire OIDC providers via API.
# Authentik creates a service account with this token on first run when set in .env.
authentik_bootstrap_token: >-
  {{ lookup('password', (lookup('env', 'HOME') + '/.bootstrap/authentik-bootstrap-token')
     + ' length=48 chars=ascii_letters,digits') }}
