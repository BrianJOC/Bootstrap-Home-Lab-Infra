---
# Authentik migration from bundled to shared PostgreSQL
# Run with: --tags migrate
# This task file is NOT included from main.yml — it is invoked explicitly by the Go runner.

- name: Stop Authentik containers for migration
  community.docker.docker_compose_v2:
    project_src: "{{ authentik_data_dir }}"
    state: stopped
  tags: migrate

- name: Get bundled PostgreSQL container name
  ansible.builtin.command: >
    docker ps --filter name=authentik-db --format "{{ '{{' }}.Names{{ '}}' }}"
  register: bundled_pg_container
  changed_when: false
  tags: migrate

- name: Dump Authentik database from bundled PostgreSQL
  ansible.builtin.command: >
    docker exec {{ bundled_pg_container.stdout }}
    pg_dump -U authentik -d authentik -Fc
    -f /tmp/authentik-dump.dump
  register: pg_dump_result
  tags: migrate

- name: Copy dump from bundled container to host
  ansible.builtin.command: >
    docker cp {{ bundled_pg_container.stdout }}:/tmp/authentik-dump.dump
    /tmp/authentik-dump.dump
  tags: migrate

- name: Restore Authentik database dump to shared PostgreSQL
  community.postgresql.postgresql_query:
    db: authentik
    query: "SELECT 1"
  become_user: postgres
  register: pg_restore_precheck
  tags: migrate

- name: Restore dump to shared PostgreSQL
  ansible.builtin.command: >
    pg_restore -h {{ bootstrap_server_ip }} -U authentik -d authentik
    --no-owner --no-privileges -1 /tmp/authentik-dump.dump
  environment:
    PGPASSWORD: "{{ authentik_db_password }}"
  register: pg_restore_result
  no_log: true
  tags: migrate

- name: Update Authentik .env with shared PostgreSQL DSN
  ansible.builtin.template:
    src: authentik.env.j2
    dest: "{{ authentik_data_dir }}/.env"
    mode: "0600"
  vars:
    authentik_use_bundled_postgres: false
  no_log: true
  tags: migrate

- name: Update Authentik docker-compose.yml for shared PostgreSQL
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ authentik_data_dir }}/docker-compose.yml"
    mode: "0644"
  vars:
    authentik_use_bundled_postgres: false
  tags: migrate

- name: Start Authentik with shared PostgreSQL
  community.docker.docker_compose_v2:
    project_src: "{{ authentik_data_dir }}"
    state: present
  no_log: true
  tags: migrate

- name: Wait for Authentik API after migration
  ansible.builtin.uri:
    url: "http://localhost:{{ authentik_port_http }}/api/v3/root/config/"
    method: GET
    status_code: [200]
    validate_certs: false
  register: authentik_post_migrate_check
  retries: 30
  delay: 10
  until: authentik_post_migrate_check.status == 200
  tags: migrate

- name: Clean up dump file
  ansible.builtin.file:
    path: /tmp/authentik-dump.dump
    state: absent
  tags: migrate

- name: Log migration completion
  ansible.builtin.debug:
    msg: "Authentik migration to shared PostgreSQL complete. API is healthy."
  tags: migrate
