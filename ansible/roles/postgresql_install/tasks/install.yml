---
- name: Install prerequisites for PostgreSQL apt repo
  ansible.builtin.apt:
    name:
      - gnupg
      - curl
      - lsb-release
    state: present
    update_cache: true

# Fetch and dearmor the PGDG signing key. SHA256 checksum of the armored .asc
# file pins the key to the known PGDG release — detects CDN compromise or MITM.
- name: Fetch PostgreSQL apt signing key (armored)
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /tmp/postgresql-pgdg.asc
    checksum: "sha256:0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76"
    mode: "0644"
  register: pgdg_key_download

- name: Dearmor PostgreSQL apt signing key
  ansible.builtin.command:
    cmd: gpg --dearmor -o /usr/share/keyrings/postgresql.gpg /tmp/postgresql-pgdg.asc
    creates: /usr/share/keyrings/postgresql.gpg

- name: Remove temporary armored key file
  ansible.builtin.file:
    path: /tmp/postgresql-pgdg.asc
    state: absent

- name: Add PostgreSQL apt repository (pgdg)
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/postgresql.gpg]
      https://apt.postgresql.org/pub/repos/apt
      {{ ansible_distribution_release }}-pgdg main
    state: present
    filename: pgdg
    update_cache: true

- name: Install PostgreSQL
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgresql_version }}"
      - "postgresql-client-{{ postgresql_version }}"
      - python3-psycopg2
    state: present
    update_cache: true

- name: Ensure PostgreSQL service is started and enabled
  ansible.builtin.systemd:
    name: "postgresql@{{ postgresql_version }}-main"
    state: started
    enabled: true
