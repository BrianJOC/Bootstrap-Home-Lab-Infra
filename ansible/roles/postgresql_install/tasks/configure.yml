---
# Set postgres admin password. This task runs on every converge — if pg_admin_password
# changes (e.g. BOOTSTRAP_ADMIN_PASSWORD rotation), the PostgreSQL superuser password
# changes too. Intentional: the admin password tracks the bootstrap credential.
- name: Set PostgreSQL admin password
  community.postgresql.postgresql_user:
    name: postgres
    password: "{{ pg_admin_password }}"
    state: present
  become_user: postgres
  no_log: true

# Create service users first, then databases owned by them. PostgreSQL 15+ revoked the
# default CREATE grant on schema public, and "ALL ON DATABASE" does not cover schema-level
# CREATE — so a non-owner service user cannot load GitLab's schema
# ("permission denied for schema public"). Making the service user the database owner
# covers schema public via pg_database_owner.
- name: Create service users
  community.postgresql.postgresql_user:
    name: "{{ item.user }}"
    password: "{{ lookup('vars', item.user + '_db_password') }}"
    state: present
  loop: "{{ postgresql_databases }}"
  become_user: postgres
  no_log: true

- name: Create service databases owned by their service users
  community.postgresql.postgresql_db:
    name: "{{ item.name }}"
    owner: "{{ item.user }}"
    state: present
  loop: "{{ postgresql_databases }}"
  become_user: postgres

- name: Grant service users full privileges on their databases
  community.postgresql.postgresql_privs:
    login_db: "{{ item.name }}"
    privs: ALL
    type: database
    obj: "{{ item.name }}"
    roles: "{{ item.user }}"
    state: present
  loop: "{{ postgresql_databases }}"
  become_user: postgres

# Configure pg_hba.conf to allow connections from bootstrap server
- name: Configure pg_hba.conf for service users
  community.postgresql.postgresql_pg_hba:
    dest: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
    contype: host
    users: "{{ item.user }}"
    source: "{{ bootstrap_server_ip }}/32"
    databases: "{{ item.name }}"
    method: md5
    state: present
  loop: "{{ postgresql_databases }}"
  notify: reload postgresql

# Configure listen_addresses via lineinfile. postgresql_set always reports changed
# for restart-required params; lineinfile is properly idempotent.
- name: Configure PostgreSQL listen_addresses
  ansible.builtin.lineinfile:
    dest: "/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf"
    regexp: "^#?listen_addresses\\s*="
    line: "listen_addresses = 'localhost,{{ bootstrap_server_ip }}'"
    state: present
  notify: restart postgresql

# GitLab loads its full schema in a single transaction; the Ubuntu default of 64 locks
# per transaction overflows mid-load ("out of shared memory" at structure.sql). 128 is
# GitLab's documented value for shared/external PostgreSQL.
- name: Configure PostgreSQL max_locks_per_transaction for GitLab schema load
  ansible.builtin.lineinfile:
    dest: "/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf"
    regexp: "^#?max_locks_per_transaction\\s*="
    line: "max_locks_per_transaction = 128"
    state: present
  notify: restart postgresql

- name: Flush handlers to apply pg config changes
  ansible.builtin.meta: flush_handlers
