---
- name: Verify storage setup (full mode)
  hosts: all
  become: true
  tasks:
    - name: Check /data is mounted
      ansible.builtin.command:
        argv: [mountpoint, -q, /data]
      changed_when: false

    - name: Read /etc/fstab
      ansible.builtin.slurp:
        src: /etc/fstab
      register: fstab_content

    - name: Assert fstab has homelab-data entry
      ansible.builtin.assert:
        that: "'homelab-data' in (fstab_content['content'] | b64decode)"
        fail_msg: "/etc/fstab does not contain a homelab-data entry"

    - name: Read /etc/docker/daemon.json
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: daemon_json_content

    - name: Assert daemon.json contains /data/docker
      ansible.builtin.assert:
        that: "'/data/docker' in (daemon_json_content['content'] | b64decode)"
        fail_msg: "/etc/docker/daemon.json does not contain /data/docker"

    - name: Check service directories exist under /data
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: service_dirs
      loop:
        - { path: /data/docker,     mode: "0710" }
        - { path: /data/postgresql, mode: "0755" }
        - { path: /data/vault,      mode: "0755" }
        - { path: /data/authentik,  mode: "0755" }
        - { path: /data/gitlab,     mode: "0755" }
        - { path: /data/technitium, mode: "0755" }
        - { path: /data/maas,       mode: "0755" }

    - name: Assert all service directories exist, are owned root:root, and have correct mode
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
          - item.stat.pw_name == 'root'
          - item.stat.gr_name == 'root'
          - item.stat.mode == item.item.mode
        fail_msg: >
          Directory {{ item.item.path }} failed assertions:
          exists={{ item.stat.exists }},
          isdir={{ item.stat.isdir }},
          owner={{ item.stat.pw_name }}:{{ item.stat.gr_name }},
          mode={{ item.stat.mode }}
      loop: "{{ service_dirs.results }}"
