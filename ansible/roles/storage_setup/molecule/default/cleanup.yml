---
- name: Cleanup loop device
  hosts: all
  become: true
  tasks:
    - name: Unmount /data if mounted
      ansible.posix.mount:
        path: /data
        state: unmounted
      ignore_errors: true

    - name: Remove fstab entry
      ansible.posix.mount:
        path: /data
        state: absent
      ignore_errors: true

    - name: Read loop device path from remote host
      ansible.builtin.slurp:
        src: /tmp/test-loop-device
      register: loop_device_file
      ignore_errors: true

    - name: Detach loop device
      ansible.builtin.command:
        argv:
          - losetup
          - -d
          - "{{ loop_device_file['content'] | b64decode | trim }}"
      when: loop_device_file is not failed and loop_device_file['content'] is defined
      ignore_errors: true

    - name: Remove backing file
      ansible.builtin.file:
        path: /tmp/test-disk.img
        state: absent

    - name: Remove device path file
      ansible.builtin.file:
        path: /tmp/test-loop-device
        state: absent
