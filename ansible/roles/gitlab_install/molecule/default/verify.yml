---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Check gitlab-runsvdir service is active
      ansible.builtin.systemd:
        name: gitlab-runsvdir
      register: gitlab_runsvdir

    - name: Assert gitlab-runsvdir is active
      ansible.builtin.assert:
        that:
          - gitlab_runsvdir.status.ActiveState == "active"
        fail_msg: "gitlab-runsvdir service is not active (state: {{ gitlab_runsvdir.status.ActiveState }})"

    - name: Check GitLab health endpoint returns 200
      ansible.builtin.uri:
        url: "https://localhost/-/health"
        method: GET
        validate_certs: false
        status_code: 200
      register: gitlab_health
      retries: 20
      delay: 30
      until: gitlab_health.status == 200

    - name: Assert GitLab health endpoint returned 200
      ansible.builtin.assert:
        that:
          - gitlab_health.status == 200
        fail_msg: "GitLab /-/health did not return 200 (status: {{ gitlab_health.status }})"
        success_msg: "GitLab is healthy (/-/health returned 200)"

    - name: Check GitLab API v4 returns version info
      ansible.builtin.uri:
        url: "https://localhost/api/v4/version"
        method: GET
        validate_certs: false
        status_code: 401  # Unauthenticated access returns 401; proves API is up
      register: gitlab_api

    - name: Assert GitLab API v4 is reachable
      ansible.builtin.assert:
        that:
          - gitlab_api.status == 401
        fail_msg: "GitLab API v4 did not respond (status: {{ gitlab_api.status }})"
        success_msg: "GitLab API v4 is reachable (responded with 401 as expected for unauthenticated)"

    - name: Check gitlab-runner service is active
      ansible.builtin.systemd:
        name: gitlab-runner
      register: gitlab_runner_svc

    - name: Assert gitlab-runner service is active
      ansible.builtin.assert:
        that:
          - gitlab_runner_svc.status.ActiveState == "active"
        fail_msg: "gitlab-runner service is not active (state: {{ gitlab_runner_svc.status.ActiveState }})"
        success_msg: "gitlab-runner service is active"
