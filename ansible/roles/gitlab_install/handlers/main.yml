---
# Triggered by: notify: gitlab-ctl-reconfigure
# Used for Day 2 gitlab.rb changes outside the initial install path.
- name: gitlab-ctl-reconfigure
  ansible.builtin.command: gitlab-ctl reconfigure
  no_log: true

- name: restart gitlab-runner
  ansible.builtin.systemd:
    name: gitlab-runner
    state: restarted
  listen: restart gitlab-runner
