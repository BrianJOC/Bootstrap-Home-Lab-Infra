---
# Initial installs are reproducible; the lifecycle maintenance policy owns
# later deadline-based application upgrades.
gitlab_version: "gitlab-ce=19.3.0-ce.0"
gitlab_port_http: 8181
gitlab_port_https: 443
gitlab_config_dir: /etc/gitlab
gitlab_health_timeout: 600
gitlab_health_interval: 15
terraform_version: "1.14.7"
terraform_checksum_amd64: "sha256:e8bbcefea8015156e04e2a325cde37a0b2fb761728bda548e2fe3b8ad7c18c96"
terraform_checksum_arm64: "sha256:04f88ee8924db27c0e26c379721965273c80c9b6a94bc5d8d8048a69163952ba"

# Path where Stage 2 (TLS) stored the wildcard cert and key.
gitlab_cert_dir: /opt/certs

# Auto-generated GitLab DB password — persisted on controller at ~/.bootstrap/.
# Must match pg-gitlab-password used by postgresql_install role.
gitlab_db_password: >-
  {{ lookup('password', (lookup('env', 'HOME') + '/.bootstrap/pg-gitlab-password')
     + ' length=32 chars=ascii_letters,digits') }}

# OIDC client secret for Authentik integration — set once OIDC provider is wired.
# Leave empty to skip OIDC configuration in gitlab.rb.
gitlab_oidc_client_id: "gitlab"
gitlab_oidc_secret: >-
  {{ lookup('file', lookup('env', 'HOME') + '/.bootstrap/oidc-gitlab-secret') | trim }}
