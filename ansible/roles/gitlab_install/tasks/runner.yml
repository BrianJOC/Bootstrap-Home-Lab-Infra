---
# Install and register GitLab Runner
- name: Check if gitlab-runner is installed
  ansible.builtin.command: gitlab-runner --version
  register: runner_version_check
  changed_when: false
  failed_when: false

# packages.gitlab.com signing key is shared between gitlab-ce and gitlab-runner repos;
# the get_url task in install.yml already placed it at /usr/share/keyrings/gitlab.gpg.
- name: Add GitLab Runner apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/gitlab.gpg]
      https://packages.gitlab.com/runner/gitlab-runner/ubuntu/
      {{ ansible_distribution_release }} main
    state: present
    filename: gitlab-runner
    update_cache: true
  when: runner_version_check.rc != 0

- name: Install GitLab Runner package
  ansible.builtin.apt:
    name: gitlab-runner
    state: present
    update_cache: false
  when: runner_version_check.rc != 0

- name: Ensure gitlab-runner service is started and enabled
  ansible.builtin.systemd:
    name: gitlab-runner
    state: started
    enabled: true

# Check if runner is already registered
- name: Check existing runner registrations
  ansible.builtin.command: gitlab-runner list
  register: runner_list_check
  changed_when: false
  failed_when: false

# GET omits no_log — response contains only non-sensitive runner metadata;
# no_log on registered uri results empties .json and breaks selectattr idempotency checks.
- name: Get existing GitLab Runner registrations
  ansible.builtin.uri:
    url: "https://localhost/api/v4/runners/all"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    validate_certs: false
    status_code: [200]
  register: existing_runners
  when: gitlab_api_token is defined

- name: Create GitLab Runner registration token
  ansible.builtin.uri:
    url: "https://localhost/api/v4/user/runners"
    method: POST
    body_format: json
    body:
      runner_type: instance_type
      description: bootstrap-runner
      tag_list:
        - bootstrap
        - terraform
        - ansible
      locked: false
      paused: false
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    validate_certs: false
    status_code: [201]
  register: runner_token_response
  when:
    - gitlab_api_token is defined
    # POST /user/runners already created the server-side record; the auth token is only
    # returned once. Gate on the LOCAL registration instead — a record left by a failed
    # registration attempt must not make this task skip forever.
    - "'bootstrap-runner' not in (runner_list_check.stdout + runner_list_check.stderr)"
  no_log: true

- name: Register GitLab Runner
  # GitLab 15.10+ workflow: with a runner authentication token only --description and the
  # executor may be passed; --tag-list/--run-untagged/--locked/... are set server-side at
  # token creation (the API task above passes tag_list). Passing them here is FATAL.
  ansible.builtin.command: >
    gitlab-runner register
    --non-interactive
    --url "https://gitlab.{{ internal_domain }}"
    --token "{{ runner_token_response.json.token }}"
    --executor shell
    --description bootstrap-runner
  when:
    - runner_token_response is defined
    - runner_token_response.json is defined
    # gitlab-runner list writes to stderr, not stdout
    - "'bootstrap-runner' not in (runner_list_check.stdout + runner_list_check.stderr)"
  no_log: true
  notify: restart gitlab-runner
