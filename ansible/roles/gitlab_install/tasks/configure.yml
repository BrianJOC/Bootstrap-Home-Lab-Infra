---
- name: Wait for GitLab to become healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ gitlab_port_http }}/-/health"
    method: GET
    status_code: [200]
  register: gitlab_health
  retries: "{{ (gitlab_health_timeout / gitlab_health_interval) | int }}"
  delay: "{{ gitlab_health_interval }}"
  until: gitlab_health.status == 200

# Omnibus retries migrate an existing schema without retrying failed seeds.
# A healthy HTTP endpoint therefore does not prove initial admin creation.
# Only an empty installation may be seeded; never reset an existing account.
- name: Complete interrupted GitLab administrator initialization
  ansible.builtin.command:
    argv:
      - gitlab-rails
      - runner
      - >-
        if User.exists?;
          abort('Existing GitLab has no root administrator; deliberate recovery required') unless User.find_by(username: 'root')&.admin?;
        else;
          abort('Refusing to seed an existing GitLab installation') if Project.exists? || Group.exists?;
          Rails.application.load_tasks;
          Rake::Task['db:seed_fu'].invoke;
          abort('GitLab administrator initialization did not complete') unless User.find_by(username: 'root')&.admin?;
          puts 'BOOTSTRAP_ADMIN_SEEDED';
        end
  environment:
    GITLAB_ROOT_PASSWORD: "{{ gitlab_admin_password }}"
  register: gitlab_admin_initialization
  changed_when: "'BOOTSTRAP_ADMIN_SEEDED' in gitlab_admin_initialization.stdout"
  no_log: true

# The bootstrap PAT is controller-only and short-lived. Terraform uses it to
# create durable groups/projects from their first creation; Ansible does not
# create or import those API objects.
- name: Check for the controller GitLab bootstrap token
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.bootstrap/gitlab-api-token"
  delegate_to: localhost
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  become: false
  register: gitlab_token_file

- name: Read the existing controller GitLab bootstrap token
  ansible.builtin.slurp:
    src: "{{ lookup('env', 'HOME') }}/.bootstrap/gitlab-api-token"
  delegate_to: localhost
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  become: false
  register: gitlab_existing_token_slurp
  no_log: true
  when: gitlab_token_file.stat.exists

- name: Validate the existing GitLab bootstrap token
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ gitlab_port_http }}/api/v4/user"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ gitlab_existing_token_slurp.content | b64decode | trim }}"
    status_code: [200, 401, 403]
  register: gitlab_existing_token_validation
  no_log: true
  when: gitlab_token_file.stat.exists

- name: Decide whether the GitLab bootstrap token must be refreshed
  ansible.builtin.set_fact:
    gitlab_token_refresh_required: >-
      {{
        (not gitlab_token_file.stat.exists) or
        (gitlab_existing_token_validation.status | default(0) != 200)
      }}
  no_log: true

- name: Mint a short-lived GitLab bootstrap API token
  ansible.builtin.command:
    argv:
      - gitlab-rails
      - runner
      - >-
        user = User.find_by!(username: 'root');
        abort('Bootstrap user is not an administrator') unless user.admin?;
        user.personal_access_tokens.where(
          name: 'bootstrap-terraform-token'
        ).destroy_all;
        t = user.personal_access_tokens.create!(
          name: 'bootstrap-terraform-token',
          scopes: ['api'],
          expires_at: 2.days.from_now
        ); puts t.token
  register: gitlab_token_create
  changed_when: true
  failed_when: >
    gitlab_token_create.rc != 0 or
    not (gitlab_token_create.stdout | trim is match('^glpat-[A-Za-z0-9_.-]{16,128}$'))
  no_log: true
  when: gitlab_token_refresh_required | bool

- name: Store the GitLab bootstrap API token on the controller
  ansible.builtin.copy:
    content: "{{ gitlab_token_create.stdout | trim }}"
    dest: "{{ lookup('env', 'HOME') }}/.bootstrap/gitlab-api-token"
    mode: "0600"
  delegate_to: localhost
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  become: false
  no_log: true
  when: gitlab_token_refresh_required | bool

- name: Read the GitLab bootstrap API token
  ansible.builtin.slurp:
    src: "{{ lookup('env', 'HOME') }}/.bootstrap/gitlab-api-token"
  delegate_to: localhost
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  become: false
  register: gitlab_token_slurp
  no_log: true

- name: Set the transient GitLab API token fact
  ansible.builtin.set_fact:
    gitlab_api_token: "{{ gitlab_token_slurp.content | b64decode | trim }}"
  no_log: true

- name: Register the host-managed GitLab Runner
  ansible.builtin.include_tasks: runner.yml
