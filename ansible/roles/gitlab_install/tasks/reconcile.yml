---
- name: Template GitLab configuration file
  ansible.builtin.template:
    src: gitlab.rb.j2
    dest: "{{ gitlab_config_dir }}/gitlab.rb"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: gitlab_configuration

- name: Reconcile GitLab after install, interruption, or configuration drift
  ansible.builtin.command: gitlab-ctl reconfigure
  no_log: true
  register: gitlab_reconfigure_result
  changed_when: gitlab_configuration is changed
  failed_when: gitlab_reconfigure_result.rc != 0
