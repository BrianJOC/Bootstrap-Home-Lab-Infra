---
- name: Assert required variables are defined
  ansible.builtin.assert:
    that:
      - internal_domain is defined and internal_domain != ""
      - bootstrap_server_ip is defined and bootstrap_server_ip != ""
      - gitlab_admin_password is defined and gitlab_admin_password != ""
      - gitlab_db_password is defined and gitlab_db_password != ""
    fail_msg: "gitlab_install requires internal_domain, bootstrap_server_ip, gitlab_admin_password, and gitlab_db_password"

- name: Ensure ~/.bootstrap directory exists on controller
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.bootstrap"
    state: directory
    mode: "0700"
  delegate_to: localhost
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  become: false

# Idempotency gate: GitLab counts as installed only when the service stack is up AND the
# package is fully configured. A half-configured package still runs services, so checking
# `gitlab-ctl status` alone would skip install.yml and wedge the run behind a 502 from the
# default config.
- name: Check if GitLab runsvdir is active
  ansible.builtin.command: gitlab-ctl status
  register: gitlab_status_check
  changed_when: false
  failed_when: false

- name: Check if GitLab CE package is fully configured
  ansible.builtin.command: dpkg-query -W -f='${Status}' gitlab-ce
  register: gitlab_pkg_status
  changed_when: false
  failed_when: false

- name: Set gitlab_already_running fact
  ansible.builtin.set_fact:
    gitlab_already_running: >-
      {{ gitlab_status_check.rc == 0 and
         gitlab_pkg_status.rc == 0 and
         'install ok installed' in gitlab_pkg_status.stdout }}

- name: Install GitLab CE
  ansible.builtin.include_tasks: install.yml
  when: not gitlab_already_running

# configure.yml runs unconditionally — it is idempotent via API check+create guards
# and the controller-side token file. Re-runs are safe.
- name: Configure GitLab
  ansible.builtin.include_tasks: configure.yml

- name: Verify GitLab
  ansible.builtin.include_tasks: verify.yml
