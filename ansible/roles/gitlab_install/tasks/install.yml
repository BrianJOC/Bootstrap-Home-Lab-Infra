---
# Package provisioning ONLY: apt repo + gitlab-ce package. Config (gitlab.rb template +
# gitlab-ctl reconfigure) lives in configure.yml so it converges on every run.
- name: Install GitLab CE dependencies
  ansible.builtin.apt:
    name:
      - curl
      - openssh-server
      - ca-certificates
      - tzdata
      - perl
      - gnupg
    state: present
    update_cache: true

# Fetch and dearmor the packages.gitlab.com signing key. apt's gpgv needs a BINARY
# keyring; the gpgkey endpoint serves an ASCII-armored block, so it MUST be dearmored
# or apt fails with NO_PUBKEY <id> / "repository ... is not signed".
# SHA256 pin on the armored .asc detects CDN compromise or MITM.
# Both gitlab-ce and gitlab-runner repos share this key (verified: same SHA256).
- name: Fetch packages.gitlab.com signing key (armored)
  ansible.builtin.get_url:
    url: https://packages.gitlab.com/gitlab/gitlab-ce/gpgkey
    dest: /tmp/gitlab-ce.asc
    checksum: "sha256:003c0ca2fea61767f8c6de7a1c0f49fc88ea3c8db95e3cd1856b32ce9d876e0f"
    mode: "0644"
  register: gitlab_key_download

- name: Dearmor GitLab signing key into apt keyring
  ansible.builtin.command:
    cmd: gpg --dearmor -o /usr/share/keyrings/gitlab.gpg /tmp/gitlab-ce.asc
    creates: /usr/share/keyrings/gitlab.gpg

- name: Remove temporary armored key file
  ansible.builtin.file:
    path: /tmp/gitlab-ce.asc
    state: absent

- name: Add GitLab CE apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/gitlab.gpg]
      https://packages.gitlab.com/gitlab/gitlab-ce/ubuntu/
      {{ ansible_distribution_release }} main
    state: present
    filename: gitlab-ce
    update_cache: true

# GITLAB_ROOT_PASSWORD is consumed once by the omnibus post-install hook and not persisted.
# Treat gitlab_admin_password as a one-time seed credential — rotate via API after bootstrap.
# NOTE: no EXTERNAL_URL in this task's environment on purpose. The package postinst runs
# `gitlab-ctl reconfigure` against the default gitlab.rb; with EXTERNAL_URL=https set,
# omnibus enables Let's Encrypt (internal-only domain -> NXDOMAIN) and dpkg leaves the
# package half-configured. The real URL/config come from the templated gitlab.rb and the
# reconfigure task in configure.yml, which runs after this file.
- name: Install GitLab CE package
  ansible.builtin.apt:
    name: "{{ gitlab_version }}"
    state: present
    update_cache: false
  environment:
    GITLAB_ROOT_PASSWORD: "{{ gitlab_admin_password }}"
  no_log: true
