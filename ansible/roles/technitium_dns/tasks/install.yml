---
# Install Docker if not present
- name: Check if docker is installed
  ansible.builtin.command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true
  when: docker_check.rc != 0

- name: Add Docker apt GPG key
  ansible.builtin.shell: |
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    chmod a+r /etc/apt/keyrings/docker.asc
  args:
    creates: /etc/apt/keyrings/docker.asc
  when: docker_check.rc != 0

- name: Add Docker apt repository
  ansible.builtin.shell: |
    echo \
      "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] \
      https://download.docker.com/linux/ubuntu \
      $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
      tee /etc/apt/sources.list.d/docker.list > /dev/null
  args:
    creates: /etc/apt/sources.list.d/docker.list
  when: docker_check.rc != 0

- name: Install docker.io and docker-compose-plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  when: docker_check.rc != 0

- name: Ensure Docker service is started and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

# Create Technitium data directory and compose file
- name: Create Technitium data directory
  ansible.builtin.file:
    path: "{{ technitium_data_dir }}"
    state: directory
    mode: "0755"

- name: Create Technitium compose directory
  ansible.builtin.file:
    path: /opt/technitium
    state: directory
    mode: "0755"

- name: Template Technitium Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/technitium/docker-compose.yml
    mode: "0644"
  notify: restart technitium

- name: Start Technitium via Docker Compose
  community.docker.docker_compose_v2:
    project_src: /opt/technitium
    state: present
