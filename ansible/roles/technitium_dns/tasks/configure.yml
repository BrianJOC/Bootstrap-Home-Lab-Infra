---
- name: Ensure controller bootstrap credential directory exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.bootstrap"
    state: directory
    mode: "0700"
  delegate_to: localhost
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  become: false

- name: Inspect persisted Technitium automation token
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.bootstrap/technitium-api-token"
  register: technitium_token_file
  delegate_to: localhost
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  become: false

- name: Read persisted Technitium automation token
  ansible.builtin.set_fact:
    technitium_api_token: >-
      {{ lookup('file', lookup('env', 'HOME') + '/.bootstrap/technitium-api-token') | trim }}
  when: technitium_token_file.stat.exists
  no_log: true

- name: Validate persisted Technitium automation token
  ansible.builtin.uri:
    url: "http://localhost:{{ technitium_port_http }}/api/user/session/get"
    method: GET
    headers:
      Authorization: "Bearer {{ technitium_api_token }}"
    status_code: [200]
    return_content: true
  register: technitium_token_validation
  failed_when: false
  when: technitium_api_token is defined
  no_log: true

- name: Create non-expiring Technitium automation token
  ansible.builtin.uri:
    url: "http://localhost:{{ technitium_port_http }}/api/user/createToken"
    method: POST
    body_format: form-urlencoded
    body:
      user: admin
      pass: "{{ technitium_admin_password }}"
      tokenName: bootstrap-home-infra
    status_code: [200]
    return_content: true
  register: technitium_token_created
  retries: 30
  delay: 5
  until: >-
    technitium_token_created.status == 200 and
    (technitium_token_created.content | from_json).get('status', 'error') == 'ok'
  when: >-
    technitium_token_validation is skipped or
    (technitium_token_validation.content | default('{}') | from_json).get('status', 'error') != 'ok'
  no_log: true

- name: Select effective Technitium automation token
  ansible.builtin.set_fact:
    technitium_api_token: >-
      {{ (technitium_token_created.content | from_json).token
         if technitium_token_created is not skipped
         else technitium_api_token }}
  no_log: true

- name: Persist Technitium automation token on controller
  ansible.builtin.copy:
    content: "{{ technitium_api_token }}"
    dest: "{{ lookup('env', 'HOME') }}/.bootstrap/technitium-api-token"
    mode: "0600"
  delegate_to: localhost
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  become: false
  no_log: true

- name: Ensure systemd-resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"
  when: ansible_service_mgr == "systemd"

- name: Configure systemd-resolved drop-in for Technitium
  ansible.builtin.template:
    src: resolved.conf.j2
    dest: /etc/systemd/resolved.conf.d/99-technitium.conf
    mode: "0644"
  when: ansible_service_mgr == "systemd"
  notify: reload resolver

- name: Flush handlers so systemd-resolved uses Technitium for DNS
  ansible.builtin.meta: flush_handlers
  when: ansible_service_mgr == "systemd"

- name: Point /etc/resolv.conf at full resolver
  ansible.builtin.file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  when: ansible_service_mgr == "systemd"
