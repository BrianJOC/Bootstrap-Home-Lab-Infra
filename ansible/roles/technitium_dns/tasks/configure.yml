---
# Wait for Technitium API to be available
- name: Wait for Technitium HTTP API to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ technitium_port_http }}/api/user/login"
    method: POST
    body_format: form-urlencoded
    body:
      user: admin
      pass: "{{ technitium_admin_password }}"
      includeInfo: "true"
    status_code: [200]
    validate_certs: false
    return_content: true
  register: technitium_login
  retries: 30
  delay: 5
  until: technitium_login.status == 200 and (technitium_login.content | from_json).get('status', 'error') == 'ok'
  no_log: true

- name: Set Technitium API token fact
  ansible.builtin.set_fact:
    technitium_api_token: "{{ (technitium_login.content | from_json)['token'] }}"
  # NOTE: no_log intentionally absent. Ansible-core 2.20 in role context breaks
  # set_fact when accessing .json attributes of no_log uri task results (Python 3.14
  # getattr vs __getitem__ issue). Token is short-lived and session-scoped.

# Check if zone already exists
- name: Check if DNS zone already exists
  ansible.builtin.uri:
    url: "http://localhost:{{ technitium_port_http }}/api/zones/list?token={{ technitium_api_token }}"
    method: GET
    status_code: [200]
    return_content: true
  register: zone_list
  # NOTE: no_log omitted — see set_fact note above. Token is in URL query param.

- name: Set zone_exists fact
  ansible.builtin.set_fact:
    technitium_zone_exists: >-
      {{ (zone_list.content | from_json).get('response', {}).get('zones', []) |
         selectattr('name', 'equalto', internal_domain) | list | length > 0 }}

- name: Create primary DNS zone
  ansible.builtin.uri:
    url: "http://localhost:{{ technitium_port_http }}/api/zones/create"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ technitium_api_token }}"
      zone: "{{ internal_domain }}"
      type: Primary
    status_code: [200]
  when: not technitium_zone_exists
  no_log: true

# Check existing DNS records and create missing ones
- name: Check existing DNS records
  ansible.builtin.uri:
    url: "http://localhost:{{ technitium_port_http }}/api/zones/records/get?token={{ technitium_api_token }}&zone={{ internal_domain }}&domain={{ item.name }}.{{ internal_domain }}&type=A"
    method: GET
    status_code: [200]
    return_content: true
  register: dns_record_checks
  loop: "{{ technitium_dns_records }}"

- name: Create A records for bootstrap services
  ansible.builtin.uri:
    url: "http://localhost:{{ technitium_port_http }}/api/zones/records/add"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ technitium_api_token }}"
      zone: "{{ internal_domain }}"
      domain: "{{ item.item.name }}.{{ internal_domain }}"
      type: A
      ipAddress: "{{ bootstrap_server_ip }}"
      ttl: "3600"
    status_code: [200]
  loop: "{{ dns_record_checks.results }}"
  when: >
    (item.content | from_json).get('response', {}).get('records', []) | length == 0
  loop_control:
    label: "{{ item.item.name }}.{{ internal_domain }}"

# Configure target resolver to use Technitium
- name: Ensure systemd-resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"
  when: ansible_service_mgr == "systemd"

- name: Configure systemd-resolved drop-in for Technitium
  ansible.builtin.template:
    src: resolved.conf.j2
    dest: /etc/systemd/resolved.conf.d/99-technitium.conf
    mode: "0644"
  when: ansible_service_mgr == "systemd"
  notify: reload resolver

- name: Flush handlers so systemd-resolved uses Technitium for DNS
  ansible.builtin.meta: flush_handlers
  when: ansible_service_mgr == "systemd"

- name: Point /etc/resolv.conf at full resolver (routes to Technitium)
  ansible.builtin.file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  when: ansible_service_mgr == "systemd"
