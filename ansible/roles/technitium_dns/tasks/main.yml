---
# Idempotency gate: check if Technitium is already running on port 5380
- name: Check if Technitium is already running
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ technitium_port_http }}"
    timeout: 3
    state: started
  register: technitium_port_check
  ignore_errors: true

- name: Set technitium_already_running fact
  ansible.builtin.set_fact:
    technitium_already_running: "{{ technitium_port_check is succeeded }}"

- name: Install and deploy Technitium
  ansible.builtin.include_tasks: install.yml
  when: not technitium_already_running

- name: Configure Technitium DNS zones and records
  ansible.builtin.include_tasks: configure.yml

- name: Verify Technitium DNS
  ansible.builtin.include_tasks: verify.yml
