---
- name: Assert DNS port 53 is listening
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ technitium_port_dns }}"
    timeout: 30
    state: started

- name: Assert Technitium HTTP port is listening
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ technitium_port_http }}"
    timeout: 10
    state: started

- name: Log Technitium runtime verification result
  ansible.builtin.debug:
    msg: "Technitium runtime and API ports are ready; Terraform owns zones and records."
