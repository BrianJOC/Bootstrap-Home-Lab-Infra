---
- name: Assert DNS port 53 is listening
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ technitium_port_dns }}"
    timeout: 30
    state: started

- name: Assert Technitium HTTP port is listening
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ technitium_port_http }}"
    timeout: 10
    state: started

- name: Install dnsutils for dig command
  ansible.builtin.apt:
    name: dnsutils
    state: present

- name: DNS resolution check — vault
  ansible.builtin.command: "dig @127.0.0.1 vault.{{ internal_domain }} +short"
  register: dns_check_vault
  changed_when: false
  failed_when: dns_check_vault.stdout | trim != bootstrap_server_ip

- name: DNS resolution check — authentik
  ansible.builtin.command: "dig @127.0.0.1 authentik.{{ internal_domain }} +short"
  register: dns_check_authentik
  changed_when: false
  failed_when: dns_check_authentik.stdout | trim != bootstrap_server_ip

- name: DNS resolution check — gitlab
  ansible.builtin.command: "dig @127.0.0.1 gitlab.{{ internal_domain }} +short"
  register: dns_check_gitlab
  changed_when: false
  failed_when: dns_check_gitlab.stdout | trim != bootstrap_server_ip

- name: Log DNS verification result
  ansible.builtin.debug:
    msg: >
      DNS verification complete:
      vault={{ dns_check_vault.stdout | trim }},
      authentik={{ dns_check_authentik.stdout | trim }},
      gitlab={{ dns_check_gitlab.stdout | trim }}
