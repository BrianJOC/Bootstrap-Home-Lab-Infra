---
# Converge Vault configuration on every run. Everything here is idempotent: dirs,
# TLS material, vault.hcl, the systemd unit and the service state.
# The Vault listener binds {{ bootstrap_server_ip }} (see vault.hcl.j2), so all
# local API calls use that address too — not localhost.

# Create vault system user
- name: Create vault system user
  ansible.builtin.user:
    name: "{{ vault_user }}"
    system: true
    shell: /bin/false
    home: "{{ vault_data_dir }}"
    create_home: false

# Create required directories
- name: Create Vault data directory
  ansible.builtin.file:
    path: "{{ vault_data_dir }}"
    state: directory
    owner: "{{ vault_user }}"
    group: "{{ vault_user }}"
    mode: "0750"

- name: Create Vault config directory
  ansible.builtin.file:
    path: "{{ vault_config_dir }}"
    state: directory
    owner: "{{ vault_user }}"
    group: "{{ vault_user }}"
    mode: "0750"

- name: Create Vault TLS directory
  ansible.builtin.file:
    path: "{{ vault_config_dir }}/tls"
    state: directory
    owner: "{{ vault_user }}"
    group: "{{ vault_user }}"
    mode: "0750"

- name: Create Vault log directory
  ansible.builtin.file:
    path: /var/log/vault
    state: directory
    owner: "{{ vault_user }}"
    group: "{{ vault_user }}"
    mode: "0750"

# Copy TLS certs to vault config path.
# lego stores wildcard certs with '*' replaced by '_' in the filename.
- name: Copy TLS cert to Vault TLS dir
  ansible.builtin.copy:
    src: "{{ vault_cert_dir }}/certificates/_.{{ internal_domain }}.crt"
    dest: "{{ vault_config_dir }}/tls/fullchain.pem"
    owner: "{{ vault_user }}"
    group: "{{ vault_user }}"
    mode: "0644"
    remote_src: true
  notify: restart vault

- name: Copy TLS private key to Vault TLS dir
  ansible.builtin.copy:
    src: "{{ vault_cert_dir }}/certificates/_.{{ internal_domain }}.key"
    dest: "{{ vault_config_dir }}/tls/privkey.pem"
    owner: "{{ vault_user }}"
    group: "{{ vault_user }}"
    mode: "0400"
    remote_src: true
  notify: restart vault

# Template vault.hcl config
- name: Template Vault configuration file
  ansible.builtin.template:
    src: vault.hcl.j2
    dest: "{{ vault_config_dir }}/vault.hcl"
    owner: "{{ vault_user }}"
    group: "{{ vault_user }}"
    mode: "0640"
  notify: restart vault

# Template systemd unit
- name: Template Vault systemd service unit
  ansible.builtin.template:
    src: vault.service.j2
    dest: /etc/systemd/system/vault.service
    mode: "0644"
  notify: restart vault

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

# Apply any pending config restarts BEFORE the service start / init / unseal below,
# so a handler flush at end of play cannot restart (and reseal) a freshly-unsealed Vault.
- name: Flush handlers so Vault picks up final config before initialization
  ansible.builtin.meta: flush_handlers

# Start vault service
- name: Start Vault service
  ansible.builtin.systemd:
    name: vault
    state: started
    enabled: true

# Wait for vault to be ready (sealed state is OK at this point).
# validate_certs: false is unavoidable here — Vault's TLS cert is for the internal
# domain, so IP-address checks cannot verify. This is only used at bootstrap.
- name: Wait for Vault API to respond
  ansible.builtin.uri:
    url: "https://{{ bootstrap_server_ip }}:{{ vault_port }}/v1/sys/health"
    method: GET
    validate_certs: false
    status_code: [200, 429, 472, 473, 501, 503]
  register: vault_health
  retries: 24
  delay: 5
  until: vault_health.status in [200, 429, 472, 473, 501, 503]

# Check if vault is already initialized
- name: Check Vault initialization status
  ansible.builtin.uri:
    url: "https://{{ bootstrap_server_ip }}:{{ vault_port }}/v1/sys/init"
    method: GET
    validate_certs: false
    status_code: [200]
  register: vault_init_status

- name: Set vault_initialized fact
  ansible.builtin.set_fact:
    vault_initialized: "{{ vault_init_status.json.initialized }}"

# Initialize Vault, save keys, and unseal — all in one shell task to avoid the
# Ansible 2.20 no_log role context bug (registered uri results with no_log: true
# are censored in role context, making the response body inaccessible).
# After a restart, the operator must manually unseal using vault-init.json.
- name: Initialize Vault and unseal with Shamir shares
  ansible.builtin.shell: |
    set -e
    # Create the file with restricted permissions before writing secrets into it,
    # avoiding a race window where the file is world-readable between creation and chmod.
    install -m 600 /dev/null /tmp/vault-init.json
    vault operator init \
      -key-shares={{ vault_shares | int }} \
      -key-threshold={{ vault_threshold | int }} \
      -format=json > /tmp/vault-init.json
    python3 -c "import json; keys=json.load(open('/tmp/vault-init.json'))['unseal_keys_b64'][:{{ vault_threshold | int }}]; print('\n'.join(keys))" | \
      while IFS= read -r key; do vault operator unseal "$key"; done
  when: not vault_initialized
  no_log: true
  environment:
    VAULT_ADDR: "https://{{ bootstrap_server_ip }}:{{ vault_port }}"
    VAULT_SKIP_VERIFY: "true"
  changed_when: true

- name: Fetch vault-init.json to controller
  ansible.builtin.fetch:
    src: /tmp/vault-init.json
    dest: "{{ vault_init_output_path }}"
    flat: true
  when: not vault_initialized
  no_log: true
  register: vault_init_fetched

- name: Warn operator about plaintext unseal keys
  ansible.builtin.debug:
    msg: >-
      vault-init.json has been written to {{ vault_init_output_path }}.
      This file contains plaintext Shamir unseal keys and the root token.
      Move it to encrypted storage (e.g. a password manager or encrypted USB)
      and delete the local copy once you have recorded the keys.
  when: not vault_initialized

# Gate removal on a successful fetch. If the fetch failed (network drop, etc.), the remote
# file is preserved so a retry can succeed. On subsequent runs where vault_initialized is true,
# the removal still fires (no when guard) to clean up any file left by a previous partial run.
- name: Remove vault-init.json from remote
  ansible.builtin.file:
    path: /tmp/vault-init.json
    state: absent
  when: >
    vault_initialized or
    (vault_init_fetched is defined and vault_init_fetched is not skipped and
     vault_init_fetched is not failed)

- name: Restrict vault-init.json permissions on controller
  ansible.builtin.file:
    path: "{{ vault_init_output_path }}"
    mode: "0600"
    state: file
  delegate_to: localhost
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  become: false
  when: not vault_initialized

- name: Write vault initialized marker
  ansible.builtin.file:
    path: /opt/vault/.initialized
    state: touch
    mode: "0400"
  when: not vault_initialized
