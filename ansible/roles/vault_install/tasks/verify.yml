---
- name: Assert Vault service is active
  ansible.builtin.systemd:
    name: vault
  register: vault_service_status
  failed_when: vault_service_status.status.ActiveState != "active"

- name: Assert Vault API responds (sealed state is acceptable here)
  ansible.builtin.uri:
    url: "https://{{ bootstrap_server_ip }}:{{ vault_port }}/v1/sys/health"
    method: GET
    validate_certs: false
    status_code: [200, 429, 472, 473, 501, 503]
  register: vault_api_check
  failed_when: vault_api_check.status not in [200, 429, 472, 473, 501, 503]

- name: Log Vault verification result
  ansible.builtin.debug:
    msg: >
      Vault service active.
      API status: {{ vault_api_check.status }}.
      Initialized: {{ vault_api_check.json.initialized | default('unknown') }}.
