---
# One-time binary acquisition ONLY. Everything that must converge on every run —
# vault user, data/config/TLS/log dirs, TLS copies, vault.hcl, systemd unit,
# enable/start — lives in configure.yml so a partial failure mid-install cannot
# wedge the role behind the vault_needs_install gate in main.yml.

- name: Assert supported architecture
  ansible.builtin.assert:
    that: ansible_architecture in ['x86_64', 'aarch64']
    fail_msg: "Unsupported architecture '{{ ansible_architecture }}'. Only x86_64 and aarch64 are supported."

- name: Set vault_arch and checksum facts
  ansible.builtin.set_fact:
    vault_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
    vault_sha256: "{{ vault_sha256_amd64 if ansible_architecture == 'x86_64' else vault_sha256_arm64 }}"

- name: Install unzip dependency
  ansible.builtin.apt:
    name: unzip
    state: present
    update_cache: true

- name: Create temp directory for vault download
  ansible.builtin.tempfile:
    state: directory
    suffix: vault
  register: vault_tmp_dir

- name: Download Vault binary zip
  ansible.builtin.get_url:
    url: "https://releases.hashicorp.com/vault/{{ vault_version }}/vault_{{ vault_version }}_linux_{{ vault_arch }}.zip"
    dest: "{{ vault_tmp_dir.path }}/vault.zip"
    checksum: "sha256:{{ vault_sha256 }}"
    mode: "0644"

- name: Unzip Vault binary
  ansible.builtin.unarchive:
    src: "{{ vault_tmp_dir.path }}/vault.zip"
    dest: "{{ vault_tmp_dir.path }}"
    remote_src: true

- name: Install vault binary
  ansible.builtin.copy:
    src: "{{ vault_tmp_dir.path }}/vault"
    dest: /usr/local/bin/vault
    mode: "0755"
    remote_src: true

- name: Clean up temp directory
  ansible.builtin.file:
    path: "{{ vault_tmp_dir.path }}"
    state: absent

# Set vault capabilities for IPC_LOCK
- name: Set vault binary capabilities
  community.general.capabilities:
    path: /usr/local/bin/vault
    capability: cap_ipc_lock=+ep
    state: present
