---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Check vault service is active
      ansible.builtin.systemd:
        name: vault
      register: vault_service

    - name: Assert vault service is running
      ansible.builtin.assert:
        that:
          - vault_service.status.ActiveState == "active"
        fail_msg: "Vault service is not active (state: {{ vault_service.status.ActiveState }})"

    - name: Check Vault API responds on port 8200
      ansible.builtin.uri:
        url: "https://127.0.0.1:8200/v1/sys/health"
        method: GET
        validate_certs: false
        status_code: [200, 429, 472, 473, 501, 503]
      register: vault_health
      retries: 5
      delay: 3
      until: vault_health.status in [200, 429, 472, 473, 501, 503]

    - name: Assert Vault API responded
      ansible.builtin.assert:
        that:
          - vault_health.status in [200, 429, 472, 473, 501, 503]
        fail_msg: "Vault API on port 8200 did not respond (status: {{ vault_health.status }})"
        success_msg: "Vault API is responding on port 8200 (status: {{ vault_health.status }})"

    # 200 = initialized + unsealed. The role's init+unseal shell task must leave
    # Vault active after converge. 503 (sealed) or 501 (uninitialized) indicate failure.
    - name: Assert Vault is initialized and unsealed
      ansible.builtin.assert:
        that:
          - vault_health.status == 200
        fail_msg: >
          Vault is not unsealed after converge (HTTP {{ vault_health.status }}).
          Check that /tmp/vault-init-molecule.json was written and the
          init+unseal shell task completed successfully.
        success_msg: "Vault is initialized and unsealed (HTTP 200)"
